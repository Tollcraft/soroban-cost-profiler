[package]
name = "dummy-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "21.7"
# Pin ed25519-dalek to the 2.x line so its rand_core version matches the one
# used by soroban-env-host / rand_chacha. Without this pin Cargo resolves to
# ed25519-dalek 3.x, whose rand_core 0.9 traits are incompatible.
ed25519-dalek = "=2.1.1"

[dev-dependencies]
soroban-sdk = { version = "21.7", features = ["testutils"] }
